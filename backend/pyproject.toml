[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propagraph-backend"
version = "0.1.0"
description = "API suy luận và trực quan hóa cây lan truyền UPFD cho PropaGraph"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# torch và torch_geometric PHẢI khớp model_card.json (AGENTS.md quy tắc 4). Model card ghi
# torch 2.14.1+cu130 (Colab GPU); backend dùng bản CPU cùng phiên bản:
#   pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
#   pip install -e "backend[ml]"
ml = [
  "torch==2.14.1",
  "torch_geometric==2.8.1",
]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.8",
  "black>=24.10",
  "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

# Trùng với pyproject.toml ở gốc: black lấy cấu hình từ pyproject gần nhất.
[tool.black]
line-length = 100
target-version = ["py310"]
