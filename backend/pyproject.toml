[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propagraph-backend"
version = "0.1.0"
description = "API suy luận và trực quan hóa cây lan truyền UPFD cho PropaGraph"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# torch và torch_geometric PHẢI khớp model_card.json (AGENTS.md quy tắc 4). Chưa có model card
# nên chưa ghim; cài riêng theo hướng dẫn README, rồi ghim tại đây ở P1-1.
ml = []
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.8",
  "black>=24.10",
  "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

# Trùng với pyproject.toml ở gốc: black lấy cấu hình từ pyproject gần nhất.
[tool.black]
line-length = 100
target-version = ["py310"]
