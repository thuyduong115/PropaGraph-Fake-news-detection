# Cấu hình công cụ dùng chung cho cả repo (lint/format). Gói backend nằm ở backend/pyproject.toml.

[tool.ruff]
line-length = 100
target-version = "py310"
# .claude chứa skill bên thứ ba (impeccable, ui-ux-pro-max), không phải mã dự án;
# artifacts/models/gnn_model.py sinh tự động từ notebook, không sửa tay.
extend-exclude = [".claude", "notebooks", "artifacts", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(\.claude|notebooks|artifacts|frontend)/
'''
